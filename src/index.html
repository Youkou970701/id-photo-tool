<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>报名照助手</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--mute:#86868b;--line:#e5e5ea;--acc:#0a84ff;--ok:#30a14e;--bad:#d93025}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#2c2c2e;--fg:#f5f5f7;--mute:#98989d;--line:#3a3a3c;--ok:#32d74b;--bad:#ff6961}}
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding:44px 20px 16px}body::before{content:"";position:fixed;top:0;left:0;right:0;height:36px;-webkit-app-region:drag}button,input,select{font:inherit;color:var(--fg)}
#drop{width:100%;border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--mute);cursor:pointer;background:var(--card)}#drop.over{border-color:var(--acc);color:var(--acc)}#drop b{display:block;font-size:16px;color:var(--fg);margin-bottom:5px}.hint{color:var(--mute);font-size:12px;line-height:1.6}.options{margin-top:14px;background:var(--card);border-radius:12px;padding:16px}.fields{display:flex;flex-wrap:wrap;align-items:end;gap:14px;margin-top:14px}label{display:flex;flex-direction:column;gap:6px}input,select{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:7px 9px}select{min-width:235px;max-width:100%}input[type=number]{width:100px}input[type=color]{width:70px;height:35px;padding:3px}#preset-note{margin-top:7px;overflow-wrap:anywhere}.previews{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.preview{min-width:0;background:var(--card);border-radius:12px;padding:14px}.image-box{margin-top:10px;height:230px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-conic-gradient(#ddd 0% 25%,#eee 0% 50%) 50%/16px 16px}.image-box img{max-width:100%;max-height:100%;object-fit:contain}.placeholder{color:#666;padding:20px}.name{font-size:12px;color:var(--mute);margin-top:8px;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:14px;margin-top:16px}#process{border:0;border-radius:9px;padding:10px 22px;color:#fff;background:var(--acc);cursor:pointer}button:disabled{opacity:.5;cursor:default}#reveal{color:var(--acc);border:0;background:none;padding:0;cursor:pointer}#status{margin:14px 0 6px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}#status.bad{color:var(--bad)}#status.ok{color:var(--ok)}[hidden]{display:none!important}:focus-visible{outline:2px solid var(--acc);outline-offset:3px}@media(max-width:580px){.previews{grid-template-columns:1fr}.image-box{height:190px}}
</style></head><body>
<button id="drop" type="button"><b>把一张人像照片拖到这里，或点击选择</b>JPEG · PNG（含透明图）· WebP · HEIC / HEIF</button>
<section class="options" aria-label="报名照规格">
<label>考试预设<select id="preset"><option value="">自定义规格</option></select></label><div id="preset-note" class="hint">请按报名公告填写要求。1 KB = 1024 字节。</div>
<div class="fields"><label>宽度（像素）<input id="width" type="number" min="1" step="1" placeholder="如 295" required></label><label>高度（像素）<input id="height" type="number" min="1" step="1" placeholder="如 413" required></label><label>大小下限（KB）<input id="minKB" type="number" min="0" step="any" placeholder="如 20" required></label><label>大小上限（KB）<input id="maxKB" type="number" min="0" step="any" placeholder="如 50" required></label><label>底色（必填）<span><input id="background" type="text" placeholder="请选择或填 #RRGGBB" size="23" maxlength="7" required> <input id="background-picker" type="color" value="#ffffff" aria-label="选择底色"></span></label></div>
</section>
<div class="previews"><section class="preview"><b>原图</b><div class="image-box"><img id="input-image" alt="原图预览" hidden><span id="input-placeholder" class="placeholder">尚未选择照片</span></div><div id="input-name" class="name"></div></section><section class="preview"><b>报名照</b><div class="image-box"><img id="output-image" alt="生成的报名照预览" hidden><span id="output-placeholder" class="placeholder">生成后显示结果</span></div><div id="output-name" class="name"></div></section></div>
<div class="actions"><button id="process" type="button" disabled>生成报名照</button><button id="reveal" type="button" hidden>显示输出文件</button></div><div id="status" role="status" aria-live="polite">所有处理均在本机完成，不收集、不上传照片。</div><div class="hint">输出到原图旁边，文件名为「原名-报名照.jpg」。请在报名网站确认成片符合具体要求。</div>
<script src="renderer.js"></script></body></html>
