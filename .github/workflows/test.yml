name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            resources: dist/mac-arm64/报名照助手.app/Contents/Resources
          - os: windows-latest
            platform: win
            arch: x64
            resources: dist/win-unpacked/resources
    runs-on: ${{ matrix.os }}
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-all.mjs
      - name: 检查原生依赖及模型资源打包
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --dir --publish never
      - name: 安装包工作线程实际处理 PNG 与 HEIC
        run: npx electron scripts/test-packaged.cjs "${{ matrix.resources }}"
